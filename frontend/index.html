<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全文档共享平台</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 登录页面 -->
        <div id="login-page" class="page">
            <div class="login-container">
                <h1>🔒 安全文档共享平台</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="username" required placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="password" required placeholder="请输入密码">
                    </div>
                    <button type="submit" class="btn-primary">登录</button>
                    <div id="login-error" class="error-message"></div>
                </form>
            </div>
        </div>

        <!-- 主页面 -->
        <div id="main-page" class="page hidden">
            <header>
                <div class="header-left">
                    <h1>🔒 安全文档共享平台</h1>
                </div>
                <div class="header-right">
                    <span id="current-user"></span>
                    <button id="logout-btn" class="btn-secondary">退出</button>
                </div>
            </header>

            <div class="container">
                <!-- 侧边栏 -->
                <aside class="sidebar">
                    <nav>
                        <a href="#" class="nav-item active" data-page="documents">📄 文档列表</a>
                        <a href="#" class="nav-item" data-page="viewer" style="display:none;">📖 文档查看</a>
                        <a href="#" class="nav-item admin-only" data-page="upload">📤 上传文档</a>
                        <a href="#" class="nav-item admin-only" data-page="logs">📊 访问日志</a>
                        <a href="#" class="nav-item admin-only" data-page="fingerprints">🖥️ 设备指纹</a>
                        <a href="#" class="nav-item admin-only" data-page="users">👥 用户管理</a>
                        <a href="#" class="nav-item" data-page="password">🔑 修改密码</a>
                    </nav>
                </aside>

                <!-- 内容区域 -->
                <main class="content">
                    <!-- 文档列表 -->
                    <div id="page-documents" class="content-page active">
                        <h2>文档列表</h2>
                        <div id="documents-list" class="documents-grid"></div>
                    </div>

                    <!-- 文档查看器 -->
                    <div id="page-viewer" class="content-page">
                        <div class="viewer-header">
                            <button id="back-to-list" class="btn-secondary">← 返回列表</button>
                            <span id="viewer-doc-name"></span>
                            <span id="viewer-page-info">第 1 页</span>
                        </div>
                        <div class="viewer-container">
                            <div class="viewer-nav">
                                <button id="prev-page" class="btn-nav">◀ 上一页</button>
                                <button id="next-page" class="btn-nav">下一页 ▶</button>
                            </div>
                            <div class="pdf-viewer-wrapper">
                                <canvas id="pdf-canvas"></canvas>
                                <div id="watermark-overlay"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 上传文档 -->
                    <div id="page-upload" class="content-page">
                        <h2>上传文档</h2>
                        <form id="upload-form" class="upload-form">
                            <div class="upload-area" id="drop-zone">
                                <p>📄 拖拽 PDF 文件到此处</p>
                                <p>或</p>
                                <input type="file" id="file-input" accept=".pdf" hidden>
                                <button type="button" class="btn-primary" onclick="document.getElementById('file-input').click()">
                                    选择文件
                                </button>
                            </div>
                            <div id="upload-status"></div>
                        </form>
                    </div>

                    <!-- 访问日志 -->
                    <div id="page-logs" class="content-page">
                        <h2>访问日志</h2>
                        <div class="table-container">
                            <table id="logs-table">
                                <thead>
                                    <tr>
                                        <th>时间</th>
                                        <th>用户</th>
                                        <th>文档</th>
                                        <th>操作</th>
                                        <th>页码</th>
                                        <th>停留时间</th>
                                        <th>IP地址</th>
                                        <th>设备指纹</th>
                                    </tr>
                                </thead>
                                <tbody id="logs-body"></tbody>
                            </table>
                        </div>
                        <div class="pagination" id="logs-pagination"></div>
                    </div>

                    <!-- 设备指纹 -->
                    <div id="page-fingerprints" class="content-page">
                        <h2>设备指纹</h2>
                        <div class="table-container">
                            <table id="fingerprints-table">
                                <thead>
                                    <tr>
                                        <th>指纹ID</th>
                                        <th>用户</th>
                                        <th>首次访问</th>
                                        <th>最后访问</th>
                                        <th>IP地址</th>
                                        <th>浏览器</th>
                                        <th>操作系统</th>
                                    </tr>
                                </thead>
                                <tbody id="fingerprints-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 用户管理 -->
                    <div id="page-users" class="content-page">
                        <h2>用户管理</h2>
                        <div class="user-form">
                            <h3>创建新用户</h3>
                            <form id="create-user-form">
                                <div class="form-row">
                                    <input type="text" id="new-username" placeholder="用户名" required>
                                    <input type="password" id="new-password" placeholder="密码" required>
                                    <select id="new-role">
                                        <option value="viewer">普通用户</option>
                                        <option value="admin">管理员</option>
                                    </select>
                                    <button type="submit" class="btn-primary">创建</button>
                                </div>
                            </form>
                        </div>
                        <div class="table-container">
                            <table id="users-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>用户名</th>
                                        <th>角色</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>修改时间</th>
                                        <th>上次登录</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="users-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 修改密码 -->
                    <div id="page-password" class="content-page">
                        <h2>修改密码</h2>
                        <div class="user-form">
                            <form id="change-password-form">
                                <div class="form-group">
                                    <label>当前密码</label>
                                    <input type="password" id="old-password" placeholder="请输入当前密码" required>
                                </div>
                                <div class="form-group">
                                    <label>新密码</label>
                                    <input type="password" id="new-password-change" placeholder="请输入新密码（至少6位）" required>
                                </div>
                                <div class="form-group">
                                    <label>确认新密码</label>
                                    <input type="password" id="confirm-password" placeholder="请再次输入新密码" required>
                                </div>
                                <button type="submit" class="btn-primary">修改密码</button>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="/js/fingerprint.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
